<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="100%" height="100%" fill="#081C3A"/>
    <style>
      .title { font: 700 42px 'Arial', sans-serif; fill: #F3F7FB; }
      .subtitle { font: 400 24px 'Arial', sans-serif; fill: #C9D6E8; }
      .label { font: 600 24px 'Arial', sans-serif; fill: #F3F7FB; }
      .body { font: 400 22px 'Arial', sans-serif; fill: #F3F7FB; }
      .small { font: 400 18px 'Arial', sans-serif; fill: #C9D6E8; }
      .tiny { font: 400 15px 'Arial', sans-serif; fill: #C9D6E8; }
      .box { fill: #0F2E5E; stroke: #5DA9E9; stroke-width: 2; rx: 20; }
      .box2 { fill: #12376E; stroke: #F28C28; stroke-width: 2; rx: 20; }
      .accent { fill: #F28C28; }
      .light { fill: #5DA9E9; }
      .good { fill: #66D17A; }
      .bad { fill: #FF6B6B; }
      .warn { fill: #FFD166; }
      .line { stroke: #C9D6E8; stroke-width: 3; }
      .arrow { stroke: #C9D6E8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#C9D6E8" />
      </marker>
    </defs>

<text x="80" y="90" class="title">Figura 9 — Como o problema vira análise</text>
<text x="80" y="130" class="subtitle">Antes do modelo, existe uma cadeia de preparação que organiza o processo analítico.</text>
<rect x="90" y="340" width="210" height="150" class="box"/><text x="120" y="420" class="label">Coleta de dados</text><line x1="300" y1="415" x2="335" y2="415" class="arrow"/><rect x="335" y="340" width="210" height="150" class="box2"/><text x="365" y="420" class="label">Tratamento</text><line x1="545" y1="415" x2="580" y2="415" class="arrow"/><rect x="580" y="340" width="210" height="150" class="box2"/><text x="610" y="420" class="label">Transformação</text><line x1="790" y1="415" x2="825" y2="415" class="arrow"/><rect x="825" y="340" width="210" height="150" class="box"/><text x="855" y="420" class="label">Modelagem</text><line x1="1035" y1="415" x2="1070" y2="415" class="arrow"/><rect x="1070" y="340" width="210" height="150" class="box"/><text x="1100" y="420" class="label">Avaliação</text><line x1="1280" y1="415" x2="1315" y2="415" class="arrow"/><rect x="1315" y="340" width="210" height="150" class="box"/><text x="1345" y="420" class="label">Decisão</text><text x="560" y="610" class="body">Foco do Dia 1: preparação, estruturação e leitura inicial dos dados.</text></svg>