<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="100%" height="100%" fill="#081C3A"/>
    <style>
      .title { font: 700 42px 'Arial', sans-serif; fill: #F3F7FB; }
      .subtitle { font: 400 24px 'Arial', sans-serif; fill: #C9D6E8; }
      .label { font: 600 24px 'Arial', sans-serif; fill: #F3F7FB; }
      .body { font: 400 22px 'Arial', sans-serif; fill: #F3F7FB; }
      .small { font: 400 18px 'Arial', sans-serif; fill: #C9D6E8; }
      .tiny { font: 400 15px 'Arial', sans-serif; fill: #C9D6E8; }
      .box { fill: #0F2E5E; stroke: #5DA9E9; stroke-width: 2; rx: 20; }
      .box2 { fill: #12376E; stroke: #F28C28; stroke-width: 2; rx: 20; }
      .accent { fill: #F28C28; }
      .light { fill: #5DA9E9; }
      .good { fill: #66D17A; }
      .bad { fill: #FF6B6B; }
      .warn { fill: #FFD166; }
      .line { stroke: #C9D6E8; stroke-width: 3; }
      .arrow { stroke: #C9D6E8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#C9D6E8" />
      </marker>
    </defs>

<text x="80" y="90" class="title">Figura 6 — Por que esse problema importa?</text>
<text x="80" y="130" class="subtitle">Modelagem de risco conecta decisão financeira, estabilidade e regulação.</text>

<circle cx="800" cy="450" r="135" fill="#102B55" stroke="#5DA9E9" stroke-width="3"/>
<text x="690" y="440" class="label">Modelagem de</text>
<text x="695" y="480" class="label">Risco de Crédito</text>

<rect x="140" y="320" width="290" height="170" class="box"/>
<text x="190" y="385" class="label">Decisão financeira</text>
<text x="180" y="430" class="small">aprovação, limite, prazo, taxa</text>

<rect x="1180" y="320" width="290" height="170" class="box2"/>
<text x="1240" y="385" class="label">Regulação</text>
<text x="1215" y="430" class="small">Basileia, capital, governança</text>

<rect x="655" y="650" width="290" height="170" class="box"/>
<text x="710" y="715" class="label">Impacto econômico</text>
<text x="690" y="760" class="small">perdas, receita, sustentabilidade</text>

<line x1="430" y1="405" x2="650" y2="430" class="arrow"/>
<line x1="1180" y1="405" x2="955" y2="430" class="arrow"/>
<line x1="800" y1="650" x2="800" y2="590" class="arrow"/>
</svg>