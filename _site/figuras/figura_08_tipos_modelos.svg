<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="100%" height="100%" fill="#081C3A"/>
    <style>
      .title { font: 700 42px 'Arial', sans-serif; fill: #F3F7FB; }
      .subtitle { font: 400 24px 'Arial', sans-serif; fill: #C9D6E8; }
      .label { font: 600 24px 'Arial', sans-serif; fill: #F3F7FB; }
      .body { font: 400 22px 'Arial', sans-serif; fill: #F3F7FB; }
      .small { font: 400 18px 'Arial', sans-serif; fill: #C9D6E8; }
      .tiny { font: 400 15px 'Arial', sans-serif; fill: #C9D6E8; }
      .box { fill: #0F2E5E; stroke: #5DA9E9; stroke-width: 2; rx: 20; }
      .box2 { fill: #12376E; stroke: #F28C28; stroke-width: 2; rx: 20; }
      .accent { fill: #F28C28; }
      .light { fill: #5DA9E9; }
      .good { fill: #66D17A; }
      .bad { fill: #FF6B6B; }
      .warn { fill: #FFD166; }
      .line { stroke: #C9D6E8; stroke-width: 3; }
      .arrow { stroke: #C9D6E8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#C9D6E8" />
      </marker>
    </defs>

<text x="80" y="90" class="title">Figura 8 — Tipos de modelos de crédito</text>
<text x="80" y="130" class="subtitle">Cada modelo responde a uma pergunta em um momento diferente da relação com o cliente.</text>

<line x1="180" y1="460" x2="1420" y2="460" class="line"/>
<circle cx="300" cy="460" r="18" class="accent"/>
<circle cx="800" cy="460" r="18" class="light"/>
<circle cx="1300" cy="460" r="18" class="warn"/>

<rect x="140" y="220" width="320" height="170" class="box"/>
<text x="190" y="285" class="label">Application scoring</text>
<text x="175" y="330" class="small">Antes da concessão</text>
<text x="175" y="365" class="small">Pergunta: conceder crédito?</text>

<rect x="640" y="220" width="320" height="170" class="box2"/>
<text x="700" y="285" class="label">Behavioral scoring</text>
<text x="675" y="330" class="small">Durante o relacionamento</text>
<text x="675" y="365" class="small">Pergunta: como o risco evolui?</text>

<rect x="1140" y="220" width="320" height="170" class="box"/>
<text x="1210" y="285" class="label">Collection scoring</text>
<text x="1185" y="330" class="small">Após atraso / cobrança</text>
<text x="1175" y="365" class="small">Pergunta: como recuperar?</text>
</svg>