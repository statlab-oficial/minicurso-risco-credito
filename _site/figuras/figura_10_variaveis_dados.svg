<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="100%" height="100%" fill="#081C3A"/>
    <style>
      .title { font: 700 42px 'Arial', sans-serif; fill: #F3F7FB; }
      .subtitle { font: 400 24px 'Arial', sans-serif; fill: #C9D6E8; }
      .label { font: 600 24px 'Arial', sans-serif; fill: #F3F7FB; }
      .body { font: 400 22px 'Arial', sans-serif; fill: #F3F7FB; }
      .small { font: 400 18px 'Arial', sans-serif; fill: #C9D6E8; }
      .tiny { font: 400 15px 'Arial', sans-serif; fill: #C9D6E8; }
      .box { fill: #0F2E5E; stroke: #5DA9E9; stroke-width: 2; rx: 20; }
      .box2 { fill: #12376E; stroke: #F28C28; stroke-width: 2; rx: 20; }
      .accent { fill: #F28C28; }
      .light { fill: #5DA9E9; }
      .good { fill: #66D17A; }
      .bad { fill: #FF6B6B; }
      .warn { fill: #FFD166; }
      .line { stroke: #C9D6E8; stroke-width: 3; }
      .arrow { stroke: #C9D6E8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#C9D6E8" />
      </marker>
    </defs>

<text x="80" y="90" class="title">Figura 10 — O que temos nos dados?</text>
<text x="80" y="130" class="subtitle">As variáveis representam dimensões diferentes do perfil e do contrato de crédito.</text>
<rect x="130" y="250" width="320" height="180" class="box"/><text x="160" y="300" class="label">Perfil do cliente</text><text x="165" y="345" class="small">• idade</text><text x="165" y="377" class="small">• residência</text><text x="165" y="409" class="small">• emprego</text><rect x="520" y="250" width="320" height="180" class="box"/><text x="550" y="300" class="label">Contrato</text><text x="555" y="345" class="small">• valor</text><text x="555" y="377" class="small">• duração</text><text x="555" y="409" class="small">• parcelas</text><rect x="910" y="250" width="320" height="180" class="box"/><text x="940" y="300" class="label">Histórico</text><text x="945" y="345" class="small">• crédito anterior</text><text x="945" y="377" class="small">• atrasos</text><text x="945" y="409" class="small">• garantias</text><rect x="325" y="540" width="320" height="180" class="box"/><text x="355" y="590" class="label">Propósito</text><text x="360" y="635" class="small">• carro</text><text x="360" y="667" class="small">• negócio</text><text x="360" y="699" class="small">• educação</text><rect x="840" y="540" width="320" height="180" class="box"/><text x="870" y="590" class="label">Situação financeira</text><text x="875" y="635" class="small">• conta</text><text x="875" y="667" class="small">• poupança</text><text x="875" y="699" class="small">• outros créditos</text></svg>