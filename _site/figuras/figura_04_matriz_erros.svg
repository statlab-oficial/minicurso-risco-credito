<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
    <rect width="100%" height="100%" fill="#081C3A"/>
    <style>
      .title { font: 700 42px 'Arial', sans-serif; fill: #F3F7FB; }
      .subtitle { font: 400 24px 'Arial', sans-serif; fill: #C9D6E8; }
      .label { font: 600 24px 'Arial', sans-serif; fill: #F3F7FB; }
      .body { font: 400 22px 'Arial', sans-serif; fill: #F3F7FB; }
      .small { font: 400 18px 'Arial', sans-serif; fill: #C9D6E8; }
      .tiny { font: 400 15px 'Arial', sans-serif; fill: #C9D6E8; }
      .box { fill: #0F2E5E; stroke: #5DA9E9; stroke-width: 2; rx: 20; }
      .box2 { fill: #12376E; stroke: #F28C28; stroke-width: 2; rx: 20; }
      .accent { fill: #F28C28; }
      .light { fill: #5DA9E9; }
      .good { fill: #66D17A; }
      .bad { fill: #FF6B6B; }
      .warn { fill: #FFD166; }
      .line { stroke: #C9D6E8; stroke-width: 3; }
      .arrow { stroke: #C9D6E8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
    <defs>
      <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M0,0 L12,6 L0,12 z" fill="#C9D6E8" />
      </marker>
    </defs>

<text x="80" y="90" class="title">Figura 4 — Nem todo erro custa a mesma coisa</text>
<text x="80" y="130" class="subtitle">Os dois erros principais têm naturezas diferentes e impactos econômicos distintos.</text>

<text x="615" y="210" class="label">Realidade</text>
<text x="250" y="460" transform="rotate(-90 250 460)" class="label">Decisão</text>

<text x="650" y="250" class="body">Adimplente</text>
<text x="1020" y="250" class="body">Inadimplente</text>
<text x="320" y="405" class="body">Aprovar</text>
<text x="345" y="635" class="body">Negar</text>

<rect x="520" y="290" width="300" height="180" fill="#113D2A" stroke="#66D17A" stroke-width="3" rx="16"/>
<rect x="880" y="290" width="300" height="180" fill="#4A1F1F" stroke="#FF6B6B" stroke-width="3" rx="16"/>
<rect x="520" y="520" width="300" height="180" fill="#4D3B11" stroke="#FFD166" stroke-width="3" rx="16"/>
<rect x="880" y="520" width="300" height="180" fill="#113D2A" stroke="#66D17A" stroke-width="3" rx="16"/>

<text x="615" y="365" class="label">Acerto</text>
<text x="935" y="350" class="label">Erro</text>
<text x="930" y="390" class="body">Aprovou quem</text>
<text x="955" y="425" class="body">não pagou</text>

<text x="615" y="595" class="label">Erro</text>
<text x="585" y="635" class="body">Negou quem</text>
<text x="595" y="670" class="body">pagaria</text>

<text x="975" y="595" class="label">Acerto</text>
</svg>