<text x="80" y="90" class="title">Figura 13 — Estratégias para lidar com desbalanceamento</text>
<text x="80" y="130" class="subtitle">O problema pode ser tratado na amostra, no critério de decisão e na avaliação do modelo.</text>
<rect x="100" y="240" width="360" height="160" class="box2"/><text x="125" y="295" class="label">Undersampling</text><text x="125" y="340" class="small">reduz exemplos da classe majoritária</text><rect x="520" y="240" width="360" height="160" class="box2"/><text x="545" y="295" class="label">Oversampling</text><text x="545" y="340" class="small">replica exemplos da classe minoritária</text><rect x="940" y="240" width="360" height="160" class="box2"/><text x="965" y="295" class="label">SMOTE</text><text x="965" y="340" class="small">cria casos sintéticos da minoria</text><rect x="310" y="520" width="360" height="160" class="box2"/><text x="335" y="575" class="label">Threshold</text><text x="335" y="620" class="small">ajusta o ponto de corte da decisão</text><rect x="730" y="520" width="360" height="160" class="box2"/><text x="755" y="575" class="label">Métricas adequadas</text><text x="755" y="620" class="small">usa recall, precisão, AUC e afins</text></svg>